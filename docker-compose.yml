# PostgreSQL 16 for local development.
# Credentials come from the root .env file (see .env.example).
# docker/postgres/init creates the test database (<POSTGRES_DB>_test)
# ONLY the first time the volume is initialized.
name: tierra-andina

services:
  postgres:
    image: postgres:16
    container_name: tierra-andina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is missing in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is missing in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is missing in .env}
      TZ: America/Caracas
      PGTZ: America/Caracas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 forces TCP: during init the temporary server only listens on the socket,
      # so the container is not reported healthy before docker/postgres/init finishes.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: tierra-andina-pgdata
