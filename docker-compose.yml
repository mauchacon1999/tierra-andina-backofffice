# PostgreSQL 16 para desarrollo local.
# Las credenciales salen del archivo .env de la raíz (ver .env.example).
# El script de docker/postgres/init crea la base de test (<POSTGRES_DB>_test)
# SOLO la primera vez que se inicializa el volumen.
name: tierra-andina

services:
  postgres:
    image: postgres:16
    container_name: tierra-andina-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Falta POSTGRES_USER en .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:?Falta POSTGRES_DB en .env}
      TZ: America/Caracas
      PGTZ: America/Caracas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1 fuerza TCP: durante el init el servidor temporal solo escucha por socket,
      # así no se reporta "healthy" antes de que termine docker/postgres/init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
    name: tierra-andina-pgdata
